<meta property="og:image" content="https://nospi.co/nospi_icon.png">
<link rel="icon" href="/nospi_icon.png">
<script>
  // Link corto de la app de Nospi: manda a la tienda correcta segun el celular.
  // En computador se queda en esta pagina con los dos botones.
  (function () {
    var ua = navigator.userAgent || '';
    if (/iPhone|iPad|iPod/i.test(ua)) { location.replace('https://apps.apple.com/co/app/nospi/id6761556688'); return; }
    if (/Android/i.test(ua)) { location.replace('https://play.google.com/store/apps/details?id=app.nospi.mobile'); return; }
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #1a0010, #880E4F); font-family: -apple-system, Helvetica, Arial, sans-serif; color: #fff; }

  h1 { font-size: 22px; margin: 12px 0 6px; }

</style>

<body>
